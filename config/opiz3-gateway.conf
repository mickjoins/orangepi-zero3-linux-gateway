# Orange Pi Zero 3 Linux Gateway configuration
# All paths and pin numbers can be overridden here.

# ---- HTTP web dashboard / API ----
http_port = 8080
# Local access works without a token. For LAN access, set the board's LAN IP
# (or 0.0.0.0) and a unique hex http_access_token. Protect this file (mode 0600).
http_bind_ip = 127.0.0.1
http_access_token =

# ---- GPIO ----
# Allwinner H618 global GPIO numbers are often bank*32+index, e.g. PC5 = 69.
# If your kernel exposes separate gpiochipN per bank, adjust gpio_chip/led_line
# accordingly (for example gpio_chip=0 and the bank-based line offset).
gpio_chip = 0
led_line = 69
button_line = 70
# The documented 3.3V -> resistor -> LED -> GPIO wiring lights at low level.
led_active_low = 1
# Most buttons connect the GPIO pin to GND; internal pull-up and inverted
# logic are enabled when button_active_low=1.
button_active_low = 1

# ---- I2C ----
# Orange Pi Zero 3 usually exposes TWI1 as /dev/i2c-1 on the 26-pin header.
i2c_bus = /dev/i2c-1
# Sensor type supported by this build: aht20
i2c_sensor_type = aht20

# ---- UART ----
# On many Armbian images /dev/ttyS1 is the header UART. Change to ttyS5,
# ttyS0 or /dev/ttyUSB0 depending on the overlay and board revision.
uart_dev = /dev/ttyS1
uart_baud = 115200

# ---- Engine ----
# Sensor/status update interval in seconds.
collect_interval_s = 2

# Optional log file. Leave empty for stderr (foreground) or syslog (daemon).
log_file = /var/log/opiz3-gateway.log
